<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 580" role="img"><title>Nominal seat gaps versus actual dogbone machining footprints</title><desc>Comparison of saved DXF S02-1 geometry for 2+4 and 12+4 lattice patterns. The dense pattern has 0.538 mm nominal spacing but adjacent dogbone cut footprints overlap. This shows the machined half of a 20 mm stock, not a whole-part fracture.</desc><rect width="1050" height="580" fill="#fbfaf7" /><text x="35" y="37" fill="#17252d" font-size="24" font-family="Arial, sans-serif" font-weight="bold">Pocket spacing must include dogbone cuts</text><text x="35" y="62" fill="#17252d" font-size="14" font-family="Arial, sans-serif" font-weight="normal">Saved DXF geometry: S02-1 rail, 187 x 30 mm, shown at the same scale.</text><text x="60" y="96" fill="#17252d" font-size="17" font-family="Arial, sans-serif" font-weight="bold">2 + 4 lattice / nominal adjacent seat gap: 35.667 mm</text><g transform="translate(85 258) scale(4.6 -4.6)"><path d="M 0.00000,0.00000 L 187.00000,0.00000 L 187.00000,30.00000 L 0.00000,30.00000 L 0.00000,0.00000 Z" fill="#d7bb85" stroke="none" stroke-width="0.12" fill-opacity="1" /><path d="M 0.00000,0.00000 L 30.00000,0.00000 L 30.00000,30.00000 L 0.00000,30.00000 L 0.00000,0.00000 Z" fill="#9ccae8" stroke="none" stroke-width="0.12" fill-opacity="1" /><path d="M 157.00000,0.00000 L 187.00000,0.00000 L 187.00000,30.00000 L 157.00000,30.00000 L 157.00000,0.00000 Z" fill="#9ccae8" stroke="none" stroke-width="0.12" fill-opacity="1" /><path d="M 65.66667,20.00000 L 75.66667,20.00000 L 75.66667,30.00000 L 65.66667,30.00000 L 65.66667,20.00000 Z" fill="#9ccae8" stroke="none" stroke-width="0.12" fill-opacity="1" /><path d="M 111.33333,20.00000 L 121.33333,20.00000 L 121.33333,30.00000 L 111.33333,30.00000 L 111.33333,20.00000 Z" fill="#9ccae8" stroke="none" stroke-width="0.12" fill-opacity="1" /><circle cx="65.66666666666669" cy="20.0" r="3.200000000000003" fill="#e85f56" stroke="#b62829" fill-opacity="0.55" st