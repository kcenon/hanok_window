name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    defaults:
      run:
        shell: bash
        working-directory: generator
    env:
      # The venv lives in generator/ because the web.sh test runs generator/.venv/bin/python.
      VENV_PYTHON: ${{ matrix.os == 'windows-latest' && '.venv/Scripts/python.exe' || '.venv/bin/python' }}
      MCP_PYTHON: ${{ matrix.os == 'windows-latest' && '.mcp-venv/Scripts/python.exe' || '.mcp-venv/bin/python' }}
      HANOK_FONT: ${{ github.workspace }}/generator/tests/fixtures/fonts/NotoSans.ttf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            generator/requirements.lock
            generator/requirements-test.lock
            generator/requirements-mcp.lock
      - name: Install
        run: |
          python -m venv .venv
          $VENV_PYTHON -m pip install -r requirements-test.lock
          $VENV_PYTHON -m pip install -e .
      - name: Official MCP SDK interoperability
        run: |
          python -m venv .mcp-venv
          $MCP_PYTHON -m pip install -r requirements-mcp.lock
          PYTHONDONTWRITEBYTECODE=1 $MCP_PYTHON tests/interop_mcp_sdk.py --server-python "$VENV_PYTHON"
      # A separate step keeps this override even if optional setup times out.
      - name: Initialize DWG converter as unavailable
        run: echo "HANOK_ODAFC=$RUNNER_TEMP/oda-unavailable/ODAFileConverter.exe" >> "$GITHUB_ENV"
      - name: Test optional ODA setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ../.github/scripts/test-install-oda.ps1
      - name: Install optional ODA File Converter
        id: oda
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: ../.github/scripts/install-oda.ps1
      - name: DWG converter status
        env:
          ODA_SETUP_OUTCOME: ${{ steps.oda.outcome }}
        run: |
          echo "ODA setup: $ODA_SETUP_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          $VENV_PYTHON -c "from hanok_generator.web import dwg; print(dwg.status())" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$ODA_SETUP_OUTCOME" = failure ]; then
            echo "::warning::ODA setup failed; the optional DWG round-trip test will be skipped."
          fi
      - name: test_encoding.py
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m unittest discover -s tests -p 'test_encoding.py'
      - name: test_package_comparison.py
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m unittest discover -s tests -p 'test_package_comparison.py'
      - name: test_manual_images.py
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m unittest discover -s tests -p 'test_manual_images.py' -v
      - name: test_output_formats.py
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m unittest discover -s tests -p 'test_output_formats.py' -v
      - name: test_package_compatibility.py
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m unittest discover -s tests -p 'test_package_compatibility.py' -v
      - name: test_package_contents.py
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m unittest discover -s tests -p 'test_package_contents.py' -v
      - name: test_generator.py
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m unittest discover -s tests -p 'test_generator.py' -v
      - name: DWG skip without converter
        if: runner.os == 'Windows'
        env:
          HANOK_ODAFC: ${{ runner.temp }}/oda-unavailable/ODAFileConverter.exe
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m unittest discover -s tests -p 'test_generator.py' -k test_dwg_round_trip_keeps_every_check -v
      - name: test_web.py
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m unittest discover -s tests -p 'test_web.py' -v
      - name: test_llm.py
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m unittest discover -s tests -p 'test_llm.py'
      - name: Verify published examples
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON examples/make_packages.py --check
      - name: Real browser design and download flows
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON tools/browser_smoke.py --output "$RUNNER_TEMP/browser-smoke"
      # Build into a fresh directory so the artifact contains only this R3 request.
      - name: R3 package manifest
        if: matrix.python == '3.11'
        run: |
          PYTHONDONTWRITEBYTECODE=1 $VENV_PYTHON -m hanok_generator build --input examples/double_r3.json --output "$RUNNER_TEMP/r3-package"
          manifests=("$RUNNER_TEMP"/r3-package/packages/*/package_manifest.json)
          if [ "${#manifests[@]}" -ne 1 ] || [ ! -f "${manifests[0]}" ]; then
            echo "Expected exactly one R3 package manifest." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/r3-manifest"
          cp -R "$(dirname "${manifests[0]}")/." "$RUNNER_TEMP/r3-manifest/"
      - name: Upload R3 package manifest
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r3-manifest-${{ matrix.os }}
          path: ${{ runner.temp }}/r3-manifest/
          if-no-files-found: error
      - name: Tests left tracked files unchanged
        run: git diff --exit-code

  compare-packages:
    name: Compare R3 package bytes
    needs: tests
    # A failed or missing matrix leg must not become a skipped successful gate.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: generator
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Require successful matrix
        env:
          MATRIX_RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$MATRIX_RESULT" != success ]; then
            echo "R3 comparison failed: matrix result is $MATRIX_RESULT." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Download R3 package manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: r3-manifest-*
          path: ${{ runner.temp }}/r3-manifests
          merge-multiple: false
      - name: Compare manifests
        run: python tools/compare_package_manifests.py "$RUNNER_TEMP/r3-manifests" --summary "$GITHUB_STEP_SUMMARY"
      - name: Compare actual geometry, reports and pixels
        run: |
          python -m pip install -r requirements-test.lock
          python -m pip install -e .
          python tools/compare_package_contents.py "$RUNNER_TEMP/r3-manifests" | tee -a "$GITHUB_STEP_SUMMARY"
          R3_CONTENT_ARTIFACTS="$RUNNER_TEMP/r3-manifests" python -m unittest discover -s tests -p test_package_contents.py -k test_real_artifacts -v
      - name: Prove a changed artifact is rejected
        env:
          R3_MANIFEST_ARTIFACTS: ${{ runner.temp }}/r3-manifests
        run: |
          python -m unittest discover -s tests -p 'test_package_comparison.py' -v
          echo "Negative control passed: a changed Ubuntu window.ai hash was rejected with exit code 1." >> "$GITHUB_STEP_SUMMARY"
      - name: Tests left tracked files unchanged
        run: git diff --exit-code
