name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows joins in #4, once the engine reads and writes its files as UTF-8 with LF.
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # The venv lives in generator/ because the web.sh test runs generator/.venv/bin/python.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install -e .
      - name: test_generator.py
        run: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m unittest discover -s tests -p 'test_generator.py'
      - name: test_web.py
        run: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m unittest discover -s tests -p 'test_web.py'
      - name: test_llm.py
        run: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m unittest discover -s tests -p 'test_llm.py'
      - name: Tests left tracked files unchanged
        run: git diff --exit-code
